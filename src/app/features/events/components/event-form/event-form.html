<app-wizard-progress [steps]="steps" [currentStep]="currentStep()" />

<div class="mt-8 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
  <form [formGroup]="form" (ngSubmit)="submit()">
    @switch (currentStep()) {
      @case (1) {
        <app-event-type-step [form]="form" />
      }
      @case (2) {
        <app-event-info-step [form]="form" />
      }
      @case (3) {
        <app-template-step [form]="form" [templates]="templates()" />
      }
      @case (4) {
        <app-summary-step
          [form]="form"
          [templates]="templates()"
          [reviewHint]="reviewHint()"
        />
      }
    }

    <div class="mt-8 flex flex-col gap-3 border-t border-slate-100 pt-6 sm:flex-row sm:items-center">
      @if (currentStep() > 1) {
        <button
          type="button"
          (click)="prevStep()"
          class="inline-flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 transition-colors hover:bg-slate-50 sm:w-auto"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
          </svg>
          Anterior
        </button>
      }

      @if (mode() === 'edit') {
        <button
          type="button"
          (click)="onCancel()"
          class="inline-flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 transition-colors hover:bg-slate-50 sm:w-auto"
        >
          Cancelar
        </button>
      }

      <div class="hidden flex-1 sm:block"></div>

      @if (currentStep() < totalSteps) {
        <button
          type="button"
          (click)="nextStep()"
          class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-indigo-500 sm:w-auto"
        >
          Continuar
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
          </svg>
        </button>
      } @else {
        <button
          type="submit"
          [disabled]="!canSubmit()"
          class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto"
        >
          {{ submitLabel() }}
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
          </svg>
        </button>
      }
    </div>
  </form>
</div>
