<div [formGroup]="form()">
  <div class="mb-6">
    <h2 class="text-lg font-semibold text-slate-900">Elegir plantilla</h2>
    <p class="mt-1 text-sm text-slate-600">Selecciona el diseño que mejor represente tu evento.</p>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (template of templates(); track template.id) {
      <article
        class="overflow-hidden rounded-2xl border-2 bg-white transition-all"
        [class.border-indigo-600]="isSelected(template.id)"
        [class.shadow-md]="isSelected(template.id)"
        [class.border-slate-200]="!isSelected(template.id)"
      >
        <div class="aspect-[4/3] overflow-hidden bg-slate-100">
          <img
            [src]="template.previewImage"
            [alt]="template.name"
            class="h-full w-full object-cover"
          />
        </div>
        <div class="p-4">
          <h3 class="font-semibold text-slate-900">{{ template.name }}</h3>
          <p class="mt-0.5 text-sm text-slate-500">{{ typeLabels[template.category] }}</p>
          <button
            type="button"
            (click)="selectTemplate(template.id)"
            class="mt-3 w-full rounded-xl px-4 py-2 text-sm font-semibold transition-colors"
            [class.bg-indigo-600]="isSelected(template.id)"
            [class.text-white]="isSelected(template.id)"
            [class.hover:bg-indigo-500]="isSelected(template.id)"
            [class.border]="!isSelected(template.id)"
            [class.border-slate-200]="!isSelected(template.id)"
            [class.text-slate-700]="!isSelected(template.id)"
            [class.hover:bg-slate-50]="!isSelected(template.id)"
          >
            {{ isSelected(template.id) ? 'Seleccionada' : 'Seleccionar' }}
          </button>
        </div>
      </article>
    }
  </div>

  <input type="hidden" formControlName="templateId" />

  @if (hasError()) {
    <p class="mt-3 text-sm text-red-600">Selecciona una plantilla para continuar.</p>
  }
</div>
