<div class="space-y-8">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900 sm:text-3xl">Mis eventos</h1>
      <p class="mt-2 max-w-xl text-sm text-slate-600 sm:text-base">
        Consulta y administra los eventos que has creado.
      </p>
    </div>
    <a
      routerLink="/events/new"
      class="inline-flex shrink-0 items-center justify-center gap-2 self-start rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      Crear invitación
    </a>
  </div>

  @if (events().length > 0) {
    <div class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3">
      @for (event of events(); track event.id) {
        <app-event-card [event]="event" />
      }
    </div>
  } @else {
    <div class="rounded-2xl border border-dashed border-slate-200 bg-white px-6 py-12 text-center">
      <p class="text-sm font-medium text-slate-900">Aún no tienes eventos</p>
      <p class="mt-1 text-sm text-slate-500">Crea tu primera invitación para comenzar.</p>
      <a
        routerLink="/events/new"
        class="mt-4 inline-flex items-center gap-2 rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-indigo-500"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Crear invitación
      </a>
    </div>
  }
</div>
