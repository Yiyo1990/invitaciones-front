<div class="mx-auto max-w-4xl">
  <div class="mb-8">
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900 sm:text-3xl">Crear invitación</h1>
    <p class="mt-2 text-sm text-slate-600 sm:text-base">
      Sigue los pasos para configurar tu evento y elegir una plantilla.
    </p>
  </div>

  @if (formError()) {
    <div
      class="mb-6 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-medium text-rose-700"
      role="alert"
    >
      {{ formError() }}
    </div>
  }

  @if (submitting()) {
    <p class="mb-4 text-sm text-slate-500" role="status">Guardando evento…</p>
  }

  <app-event-form
    mode="create"
    [initialValue]="initialValue()"
    (formSubmit)="onSubmit($event)"
  />
</div>
