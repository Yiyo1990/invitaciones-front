<div class="mx-auto max-w-4xl">
  <div class="mb-8">
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900 sm:text-3xl">Crear invitación</h1>
    <p class="mt-2 text-sm text-slate-600 sm:text-base">
      Sigue los pasos para configurar tu evento y elegir una plantilla.
    </p>
  </div>

  <app-wizard-progress [steps]="steps" [currentStep]="currentStep()" />

  <div class="mt-8 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    <form [formGroup]="form" (ngSubmit)="submit()">
      @switch (currentStep()) {
        @case (1) {
          <app-event-type-step [form]="form" />
        }
        @case (2) {
          <app-event-info-step [form]="form" />
        }
        @case (3) {
          <app-template-step [form]="form" [templates]="templates()" />
        }
        @case (4) {
          <app-summary-step [form]="form" [templates]="templates()" />
        }
      }

      <div class="mt-8 flex items-center gap-3 border-t border-slate-100 pt-6">
        @if (currentStep() > 1) {
          <button
            type="button"
            (click)="prevStep()"
            class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 transition-colors hover:bg-slate-50"
          >
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
            Anterior
          </button>
        }

        <div class="flex-1"></div>

        @if (currentStep() < totalSteps) {
          <button
            type="button"
            (click)="nextStep()"
            class="inline-flex items-center gap-2 rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-indigo-500"
          >
            Continuar
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
          </button>
        } @else {
          <button
            type="submit"
            class="inline-flex items-center gap-2 rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-indigo-500"
          >
            Crear invitación
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
          </button>
        }
      </div>
    </form>
  </div>
</div>
