@let item = guest();

<article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <h3 class="truncate font-semibold text-slate-900">{{ item.fullName }}</h3>
      @if (item.phone) {
        <p class="mt-1 text-sm text-slate-500">{{ item.phone }}</p>
      } @else {
        <p class="mt-1 text-sm text-slate-400">Sin teléfono</p>
      }
    </div>
    <app-guest-status-badge [status]="item.status" />
  </div>

  <dl class="mt-4 grid grid-cols-2 gap-3 text-sm">
    <div>
      <dt class="text-xs text-slate-500">Acompañantes</dt>
      <dd class="mt-0.5 font-medium text-slate-800">{{ item.companions }}</dd>
    </div>
    <div>
      <dt class="text-xs text-slate-500">Confirmación</dt>
      <dd class="mt-0.5 font-medium text-slate-800">
        @if (item.confirmedAt) {
          {{ item.confirmedAt | date: 'd MMM y' : undefined : 'es' }}
        } @else {
          —
        }
      </dd>
    </div>
  </dl>

  <div class="mt-4 flex gap-2 border-t border-slate-100 pt-3">
    <button
      type="button"
      (click)="onEdit()"
      class="inline-flex flex-1 items-center justify-center rounded-lg px-3 py-2 text-sm font-medium text-indigo-600 transition-colors hover:bg-indigo-50"
    >
      Editar
    </button>
    <button
      type="button"
      (click)="onRemove()"
      class="inline-flex flex-1 items-center justify-center rounded-lg px-3 py-2 text-sm font-medium text-rose-600 transition-colors hover:bg-rose-50"
    >
      Eliminar
    </button>
  </div>
</article>
