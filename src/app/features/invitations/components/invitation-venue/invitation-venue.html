<section class="section-animate rounded-2xl border border-stone-200/60 bg-white/70 p-6 shadow-sm backdrop-blur-sm sm:p-8">
  <h3 class="font-serif text-xl font-semibold text-stone-800 sm:text-2xl">{{ title() }}</h3>

  <div class="mt-5 space-y-4">
    <div class="flex items-start gap-3">
      <svg class="mt-0.5 h-5 w-5 shrink-0 text-amber-700/70" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
      </svg>
      <div>
        <p class="font-medium text-stone-800">{{ venue().name }}</p>
        <p class="mt-1 text-sm text-stone-600">{{ venue().address }}</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <svg class="h-5 w-5 shrink-0 text-amber-700/70" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </svg>
      <p class="text-sm font-medium text-stone-700">{{ venue().time }}</p>
    </div>
  </div>

  <a
    [href]="venue().mapsUrl"
    target="_blank"
    rel="noopener noreferrer"
    [attr.aria-label]="'Ver ubicación de ' + venue().name + ' (se abre en una nueva pestaña)'"
    class="mt-6 inline-flex w-full items-center justify-center gap-2 rounded-full border border-stone-300 bg-white px-5 py-2.5 text-sm font-medium text-stone-700 transition-colors hover:border-amber-700/40 hover:bg-amber-50/50 sm:w-auto"
  >
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498 4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 0 0-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0Z" />
    </svg>
    Ver ubicación
  </a>
</section>
