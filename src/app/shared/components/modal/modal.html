@if (open()) {
  <div class="fixed inset-0 z-[100] flex items-end justify-center sm:items-center sm:p-4" role="presentation">
    <!-- Overlay -->
    <button
      type="button"
      class="absolute inset-0 bg-stone-900/50 backdrop-blur-sm transition-opacity"
      (click)="onOverlayClick()"
      aria-label="Cerrar modal"
    ></button>

    <!-- Panel -->
    <div
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title() || ariaLabel()"
      [attr.aria-labelledby]="title() ? 'modal-title' : null"
      class="modal-panel relative z-10 flex max-h-[92vh] w-full max-w-lg flex-col overflow-hidden rounded-t-2xl bg-white shadow-xl sm:rounded-2xl"
    >
      <div class="flex shrink-0 items-center justify-between gap-4 border-b border-stone-100 px-5 py-4 sm:px-6">
        @if (title()) {
          <h2 id="modal-title" class="font-serif text-xl font-semibold text-stone-800 sm:text-2xl">
            {{ title() }}
          </h2>
        } @else {
          <span class="sr-only">{{ ariaLabel() }}</span>
        }

        <button
          type="button"
          (click)="close()"
          class="ml-auto inline-flex h-10 w-10 items-center justify-center rounded-full text-stone-500 transition-colors hover:bg-stone-100 hover:text-stone-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-stone-800"
          aria-label="Cerrar"
        >
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="overflow-y-auto px-5 py-5 sm:px-6 sm:py-6">
        <ng-content />
      </div>
    </div>
  </div>
}
